  // ===== Move handler (safe against rapid clicks) =====
  function playMoveSafe(startHole) {
    // Online mode: dispatch based on phase. Opener-sim uses lockstep commit
    // rounds (commit_opener_pick → server fires opener_round_applied when
    // all non-done players have committed). Alternating uses direct play_move.
    if (netMode === 'online' && netRoom) {
      const p = isOwnSide(startHole, 0) ? 0 : 1;
      if (p !== netRoom.seat) return;
      if (phaseRef.current === 'opener-sim') {
        if (netOpenerPicks[p] != null) return; // already committed; ignore
        netSend({ type: 'commit_opener_pick', player: p, hole: startHole });
      } else {
        netSend({ type: 'play_move', move: { player: p, hole: startHole } });
      }
      return;
    }
    if (phaseRef.current === 'opener-sim') {
      const p = isOwnSide(startHole, 0) ? 0 : 1;
      playMoveParallel(p, startHole);
    } else {
      playMoveV2(startHole);
    }
  }

  // ===== MP opener-sim: concurrent two-hand animator =====
  // Given the event list from `opener_round` (interleaved events for both
  // players, possibly with bumps), split by player and run two streams in
  // parallel via Promise.all. They share boardRef so seed drops render in
  // the reducer-intended order.
  async function animateOpenerRoundEvents(events, finalState) {
    const byPlayer = { 0: [], 1: [] };
    for (const ev of events) if (ev.player != null) byPlayer[ev.player].push(ev);

    const activePlayers = [0, 1].filter(p => byPlayer[p].length > 0);
    for (const p of activePlayers) {
      mpAnimatingRef.current[p] = true;
    }
    setMpAnimating(prev => {
      const next = { ...prev };
      for (const p of activePlayers) next[p] = true;
      return next;
    });

    try { getCtx(); } catch (e) {}

    await Promise.all(activePlayers.map(p => animatePlayerStream(p, byPlayer[p])));

    // After both streams complete, commit authoritative state (race-safe).
    for (const p of activePlayers) mpAnimatingRef.current[p] = false;
    const snap = (latestMoveRef.current.finalState) || finalState;
    setBoard({ holes: snap.holes.slice(), rumah: snap.rumah.slice() });
    boardRef.current = { holes: snap.holes.slice(), rumah: snap.rumah.slice() };
    openerDoneRef.current = { 0: snap.openerDone[0], 1: snap.openerDone[1] };
    if (snap.phase !== phaseRef.current) {
      setPhase(snap.phase);
      phaseRef.current = snap.phase;
      if (snap.phase === 'alternating') announceText('turn-based play begins', 1200);
    }
    setCurrentPlayer(snap.turn);
    setActiveHole(null);
    for (const p of activePlayers) {
      setTimeout(() => setHands(prev => ({ ...prev, [p]: null })), 280);
    }
    setTimeout(() => setMpAnimating(prev => {
      const next = { ...prev };
      for (const p of activePlayers) next[p] = false;
      return next;
    }), 300);
    if (snap.winner) {
      setWinner(snap.winner);
      if (snap.winner.player >= 0) { sfxWin(); burstConfetti(); }
    }
  }

  async function animatePlayerStream(player, events) {
    const b = boardRef.current;
    const PICKUP_MS = 260;
    const MOVE_MS = 220;
    const SETTLE_MS = 40;
    const DROP_AFTER_MS = 90;
    const BUMP_MS = 220;
    const CHAIN_WAIT_MS = 220;

    const myToken = abortRef.current;
    const aborted = () => abortRef.current !== myToken;

    const setMyHand = (updater) => {
      setHands(prev => {
        const cur = prev[player];
        const next = typeof updater === 'function' ? updater(cur) : updater;
        return { ...prev, [player]: next };
      });
    };

    let prevWasDrop = false;
    for (const ev of events) {
      if (aborted()) return;

      if (ev.kind === 'pickup') {
        if (prevWasDrop) { await sleep(CHAIN_WAIT_MS); if (aborted()) return; }
        b.holes[ev.hole] = 0;
        setBoard({ holes: [...b.holes], rumah: [...b.rumah] });
        const pos = positionFor({ type: 'hole', idx: ev.hole });
        if (pos) setMyHand({ x: pos.x, y: pos.y - 40, carrying: ev.count, player });
        await sleep(PICKUP_MS);
        prevWasDrop = false;
      } else if (ev.kind === 'drop') {
        const pos = positionFor(ev.at);
        if (pos) setMyHand(h => h ? { ...h, x: pos.x, y: pos.y - 40 } : h);
        await sleep(MOVE_MS + SETTLE_MS);
        if (aborted()) return;
        if (ev.at.type === 'hole') b.holes[ev.at.idx] += 1;
        else b.rumah[ev.at.p] += 1;
        setMyHand(h => h ? { ...h, carrying: h.carrying != null ? h.carrying - 1 : h.carrying } : h);
        setBoard({ holes: [...b.holes], rumah: [...b.rumah] });
        sfxDrop();
        await sleep(DROP_AFTER_MS);
        prevWasDrop = true;
      } else if (ev.kind === 'bump') {
        setMyHand(h => h ? { ...h, bump: true } : h);
        sfxBump();
        await sleep(BUMP_MS);
        if (aborted()) return;
        setMyHand(h => h ? { ...h, bump: false } : h);
        prevWasDrop = false;
      } else if (ev.kind === 'anotherTurn') {
        sfxRumah();
        announceText((player === 0 ? 'Player 1' : 'Player 2') + ' again!', 1100);
        setLastAction((player === 0 ? 'Player One' : 'Player Two') + ' landed in their rumah — another move.');
        prevWasDrop = false;
      } else if (ev.kind === 'tikam') {
        setMyHand(null);
        setCaptureFlashes(prev => new Set([...prev, ev.landedHole, ev.oppHole]));
        setBoardShake(true);
        sfxCapture();
        announceText((player === 0 ? 'Player 1' : 'Player 2') + ' tikam!', 1400);
        await sleep(650);
        if (aborted()) return;
        const oppPos = positionFor({ type: 'hole', idx: ev.oppHole });
        const landPos = positionFor({ type: 'hole', idx: ev.landedHole });
        const rumahPos = positionFor({ type: 'rumah', p: player });
        if (oppPos && landPos && rumahPos) {
          const fliers = [];
          const baseId = Date.now() + '-' + player;
          const jitter = () => (Math.random() - 0.5) * 24;
          for (let k = 0; k < ev.oppCount; k++) fliers.push({ id: baseId+'-o-'+k, fromX: oppPos.x+jitter(), fromY: oppPos.y+jitter(), toX: rumahPos.x+jitter(), toY: rumahPos.y+jitter(), delay: k*55 });
          for (let k = 0; k < ev.landCount; k++) fliers.push({ id: baseId+'-l-'+k, fromX: landPos.x+jitter(), fromY: landPos.y+jitter(), toX: rumahPos.x+jitter(), toY: rumahPos.y+jitter(), delay: 200+k*55 });
          setFlyingSeeds(prev => [...prev, ...fliers]);
          b.holes[ev.oppHole] = 0; b.holes[ev.landedHole] = 0;
          setBoard({ holes: [...b.holes], rumah: [...b.rumah] });
          const totalDuration = 200 + Math.max(ev.oppCount, ev.landCount) * 55 + 900;
          await sleep(totalDuration - 200);
          if (aborted()) return;
          b.rumah[player] += ev.loot;
          setRumahFlash(prev => new Set([...prev, player]));
          setBoard({ holes: [...b.holes], rumah: [...b.rumah] });
          await sleep(250);
          setFlyingSeeds([]);
        } else {
          b.holes[ev.oppHole] = 0; b.holes[ev.landedHole] = 0; b.rumah[player] += ev.loot;
          setBoard({ holes: [...b.holes], rumah: [...b.rumah] });
        }
        setLastAction((player === 0 ? 'Player One' : 'Player Two') + ' tikam — captured ' + ev.loot + ' seeds.');
        await sleep(450);
        setCaptureFlashes(new Set());
        setBoardShake(false);
        setRumahFlash(new Set());
        prevWasDrop = false;
      } else if (ev.kind === 'noCapture') {
        const who = player === 0 ? 'Player One' : 'Player Two';
        setLastAction(ev.reason === 'notPassedRumah'
          ? who + ' landed empty — but hadn’t passed their rumah yet. No tikam.'
          : who + ' landed empty — nothing across.');
        prevWasDrop = false;
      } else if (ev.kind === 'mati') {
        setLastAction((player === 0 ? 'Player One' : 'Player Two') + ' died in enemy territory. Turn ends.');
        prevWasDrop = false;
      }
    }
  }

  // ===== Online mode: animator for events broadcast by the server =====
  // Each incoming move_applied message produces one call; multiple can run
  // concurrently (fast player's move starts animating while opponent's is
  // still in flight). Each run mutates boardRef directly.
  async function animateOnlineEvents(events, moverPlayer, finalState) {
    mpAnimatingRef.current[moverPlayer] = true;
    setMpAnimating(prev => ({ ...prev, [moverPlayer]: true }));
    const PICKUP_MS = 260;
    const MOVE_MS = 220;
    const SETTLE_MS = 40;
    const DROP_AFTER_MS = 90;
    const CHAIN_WAIT_MS = 220;

    const b = boardRef.current;
    const setMyHand = (updater) => {
      setHands(prev => {
        const cur = prev[moverPlayer];
        const next = typeof updater === 'function' ? updater(cur) : updater;
        return { ...prev, [moverPlayer]: next };
      });
    };

    const myToken = abortRef.current;
    const aborted = () => abortRef.current !== myToken;

    let prevWasDrop = false;
    for (const ev of events) {
      if (aborted()) return;
      if (ev.player != null && ev.player !== moverPlayer) continue; // skip other player's events (shouldn't exist in MP; defensive)

      if (ev.kind === 'pickup') {
        if (prevWasDrop) { await sleep(CHAIN_WAIT_MS); if (aborted()) return; }
        b.holes[ev.hole] = 0;
        setBoard({ holes: [...b.holes], rumah: [...b.rumah] });
        const pos = positionFor({ type: 'hole', idx: ev.hole });
        if (pos) setMyHand({ x: pos.x, y: pos.y - 40, carrying: ev.count, player: moverPlayer });
        await sleep(PICKUP_MS);
        prevWasDrop = false;
      } else if (ev.kind === 'drop') {
        const pos = positionFor(ev.at);
        if (pos) setMyHand(h => h ? { ...h, x: pos.x, y: pos.y - 40 } : h);
        await sleep(MOVE_MS + SETTLE_MS);
        if (aborted()) return;
        if (ev.at.type === 'hole') b.holes[ev.at.idx] += 1;
        else b.rumah[ev.at.p] += 1;
        setMyHand(h => h ? { ...h, carrying: h.carrying != null ? h.carrying - 1 : h.carrying } : h);
        setBoard({ holes: [...b.holes], rumah: [...b.rumah] });
        sfxDrop();
        await sleep(DROP_AFTER_MS);
        prevWasDrop = true;
      } else if (ev.kind === 'anotherTurn') {
        sfxRumah();
        announceText((moverPlayer === 0 ? 'Player 1' : 'Player 2') + ' again!', 1100);
        setLastAction((moverPlayer === 0 ? 'Player One' : 'Player Two') + ' landed in their rumah — another move.');
        prevWasDrop = false;
      } else if (ev.kind === 'tikam') {
        setMyHand(null);
        setCaptureFlashes(prev => new Set([...prev, ev.landedHole, ev.oppHole]));
        setBoardShake(true);
        sfxCapture();
        announceText((moverPlayer === 0 ? 'Player 1' : 'Player 2') + ' tikam!', 1400);
        await sleep(650);
        if (aborted()) return;
        const oppPos = positionFor({ type: 'hole', idx: ev.oppHole });
        const landPos = positionFor({ type: 'hole', idx: ev.landedHole });
        const rumahPos = positionFor({ type: 'rumah', p: moverPlayer });
        if (oppPos && landPos && rumahPos) {
          const fliers = [];
          const baseId = Date.now() + '-' + moverPlayer;
          const jitter = () => (Math.random() - 0.5) * 24;
          for (let k = 0; k < ev.oppCount; k++) fliers.push({ id: baseId+'-o-'+k, fromX: oppPos.x+jitter(), fromY: oppPos.y+jitter(), toX: rumahPos.x+jitter(), toY: rumahPos.y+jitter(), delay: k*55 });
          for (let k = 0; k < ev.landCount; k++) fliers.push({ id: baseId+'-l-'+k, fromX: landPos.x+jitter(), fromY: landPos.y+jitter(), toX: rumahPos.x+jitter(), toY: rumahPos.y+jitter(), delay: 200+k*55 });
          setFlyingSeeds(prev => [...prev, ...fliers]);
          b.holes[ev.oppHole] = 0;
          b.holes[ev.landedHole] = 0;
          setBoard({ holes: [...b.holes], rumah: [...b.rumah] });
          const totalDuration = 200 + Math.max(ev.oppCount, ev.landCount) * 55 + 900;
          await sleep(totalDuration - 200);
          if (aborted()) return;
          b.rumah[moverPlayer] += ev.loot;
          setRumahFlash(prev => new Set([...prev, moverPlayer]));
          setBoard({ holes: [...b.holes], rumah: [...b.rumah] });
          await sleep(250);
          setFlyingSeeds([]);
        } else {
          b.holes[ev.oppHole] = 0; b.holes[ev.landedHole] = 0; b.rumah[moverPlayer] += ev.loot;
          setBoard({ holes: [...b.holes], rumah: [...b.rumah] });
        }
        setLastAction((moverPlayer === 0 ? 'Player One' : 'Player Two') + ' tikam — captured ' + ev.loot + ' seeds.');
        await sleep(450);
        setCaptureFlashes(new Set());
        setBoardShake(false);
        setRumahFlash(new Set());
        prevWasDrop = false;
      } else if (ev.kind === 'noCapture') {
        const who = moverPlayer === 0 ? 'Player One' : 'Player Two';
        setLastAction(ev.reason === 'notPassedRumah'
          ? who + ' landed empty — but hadn’t passed their rumah yet. No tikam.'
          : who + ' landed empty — nothing across.');
        prevWasDrop = false;
      } else if (ev.kind === 'mati') {
        setLastAction((moverPlayer === 0 ? 'Player One' : 'Player Two') + ' died in enemy territory. Turn ends.');
        prevWasDrop = false;
      } else if (ev.kind === 'phaseChange') {
        setPhase(ev.to);
        phaseRef.current = ev.to;
      } else if (ev.kind === 'turnEnd') {
        // Commit turn at the tail of the event stream below
      } else if (ev.kind === 'roundEnd') {
        // Commit winner at the tail below
      }
    }

    // Mark this animator as done BEFORE deciding to snap, so the other
    // animator (if running) sees us as not-running.
    mpAnimatingRef.current[moverPlayer] = false;

    // Race-safe commit: if the OTHER player is still animating, do NOT snap
    // boardRef — that would wipe their partial mutations. The last animator
    // to finish will snap to the latest-seq finalState the server broadcast.
    // When solo (no overlap), this is the normal case.
    const otherAnimating = mpAnimatingRef.current[1 - moverPlayer];
    if (!otherAnimating) {
      // Prefer the highest-seq finalState the server has broadcast. If this
      // animator's finalState IS the latest (common case: seq matches), we use it.
      const snap = (latestMoveRef.current.finalState) || finalState;
      setBoard({ holes: snap.holes.slice(), rumah: snap.rumah.slice() });
      boardRef.current = { holes: snap.holes.slice(), rumah: snap.rumah.slice() };
      openerDoneRef.current = { 0: snap.openerDone[0], 1: snap.openerDone[1] };
      if (snap.phase !== phaseRef.current) {
        setPhase(snap.phase);
        phaseRef.current = snap.phase;
      }
      setCurrentPlayer(snap.turn);
      if (snap.winner) {
        setWinner(snap.winner);
        if (snap.winner.player >= 0) { sfxWin(); burstConfetti(); }
      }
    }
    // Even mid-overlap, update per-player hand cleanup and UI bits that only
    // concern THIS animator's player.
    setActiveHole(null);
    setTimeout(() => setHands(prev => ({ ...prev, [moverPlayer]: null })), 280);
    // Clear the MP animating flag after the hand-clear setTimeout fires, so the
    // banner doesn't flash on during the brief hand-null cleanup gap.
    setTimeout(() => setMpAnimating(prev => ({ ...prev, [moverPlayer]: false })), 300);
  }

  // Reveal-mode helpers removed: classic (independent live-race) is the only
  // simultaneous-opener style for local play. The commit-and-reveal flow will
  // be reintroduced for multiplayer via a dedicated MP network path.

  // ===== Animator =====
  // Consumes the event list from engine.reducer() and drives all DOM/sound/hand
  // side effects. Does NOT compute game logic. `aborted()` lets the caller
  // cancel mid-animation (e.g. on reset).
  async function animateEvents(events, initialBoard, player, aborted) {
    // Working board copy for incremental renders. The animator mutates this as
    // it replays events, calling setBoard() after each delta.
    const b = { holes: [...initialBoard.holes], rumah: [...initialBoard.rumah] };

    const PICKUP_MS = 260;
    const MOVE_MS = 220;
    const SETTLE_MS = 40;
    const DROP_AFTER_MS = 90;
    const CHAIN_WAIT_MS = 220;

    const bailAnim = () => {
      setActiveHole(null);
      setHand(null);
      setCaptureFlashes(new Set());
      setBoardShake(false);
      setFlyingSeeds([]);
      setRumahFlash(new Set());
    };

    let prevWasDrop = false;

    for (let i = 0; i < events.length; i++) {
      if (aborted()) { bailAnim(); return; }
      const ev = events[i];

      if (ev.kind === 'pickup') {
        // If a chain continuation (drop → pickup back-to-back), brief pause.
        if (prevWasDrop) {
          await sleep(CHAIN_WAIT_MS);
          if (aborted()) { bailAnim(); return; }
        }
        b.holes[ev.hole] = 0;
        setActiveHole(ev.hole);
        setBoard({ holes: [...b.holes], rumah: [...b.rumah] });
        const pos = positionFor({ type: 'hole', idx: ev.hole });
        if (pos) setHand({ x: pos.x, y: pos.y - 40, carrying: ev.count, player: ev.player });
        await sleep(PICKUP_MS);
        prevWasDrop = false;
      } else if (ev.kind === 'drop') {
        const pos = positionFor(ev.at);
        if (pos) setHand(h => ({ ...(h || { player: ev.player }), x: pos.x, y: pos.y - 40 }));
        await sleep(MOVE_MS + SETTLE_MS);
        if (aborted()) { bailAnim(); return; }
        if (ev.at.type === 'hole') {
          b.holes[ev.at.idx] += 1;
        } else {
          b.rumah[ev.at.p] += 1;
        }
        setHand(h => h ? { ...h, carrying: (h.carrying != null ? h.carrying - 1 : h.carrying) } : h);
        setBoard({ holes: [...b.holes], rumah: [...b.rumah] });
        setActiveHole(ev.at.type === 'hole' ? ev.at.idx : null);
        sfxDrop();
        await sleep(DROP_AFTER_MS);
        prevWasDrop = true;
      } else if (ev.kind === 'anotherTurn') {
        sfxRumah();
        setActiveHole(null);
        announceText((ev.player === 0 ? 'Player 1' : 'Player 2') + ' again!', 1100);
        setLastAction((ev.player === 0 ? 'Player One' : 'Player Two') + ' landed in their rumah — another move.');
        prevWasDrop = false;
      } else if (ev.kind === 'tikam') {
        setHand(null);
        setCaptureFlashes(new Set([ev.landedHole, ev.oppHole]));
        setBoardShake(true);
        sfxCapture();
        announceText((ev.player === 0 ? 'Player 1' : 'Player 2') + ' tikam!', 1400);
        await sleep(650);
        if (aborted()) { bailAnim(); return; }

        const oppPos = positionFor({ type: 'hole', idx: ev.oppHole });
        const landPos = positionFor({ type: 'hole', idx: ev.landedHole });
        const rumahPos = positionFor({ type: 'rumah', p: ev.player });
        if (oppPos && landPos && rumahPos) {
          const fliers = [];
          const baseId = Date.now();
          const jitter = () => (Math.random() - 0.5) * 24;
          for (let k = 0; k < ev.oppCount; k++) {
            fliers.push({
              id: baseId + '-o-' + k,
              fromX: oppPos.x + jitter(), fromY: oppPos.y + jitter(),
              toX: rumahPos.x + jitter(), toY: rumahPos.y + jitter(),
              delay: k * 55,
            });
          }
          for (let k = 0; k < ev.landCount; k++) {
            fliers.push({
              id: baseId + '-l-' + k,
              fromX: landPos.x + jitter(), fromY: landPos.y + jitter(),
              toX: rumahPos.x + jitter(), toY: rumahPos.y + jitter(),
              delay: 200 + k * 55,
            });
          }
          setFlyingSeeds(fliers);
          b.holes[ev.oppHole] = 0;
          b.holes[ev.landedHole] = 0;
          setBoard({ holes: [...b.holes], rumah: [...b.rumah] });
          const totalDuration = 200 + Math.max(ev.oppCount, ev.landCount) * 55 + 900;
          await sleep(totalDuration - 200);
          if (aborted()) { bailAnim(); return; }
          b.rumah[ev.player] += ev.loot;
          setRumahFlash(new Set([ev.player]));
          setBoard({ holes: [...b.holes], rumah: [...b.rumah] });
          await sleep(250);
          setFlyingSeeds([]);
        } else {
          b.holes[ev.oppHole] = 0;
          b.holes[ev.landedHole] = 0;
          b.rumah[ev.player] += ev.loot;
          setRumahFlash(new Set([ev.player]));
          setBoard({ holes: [...b.holes], rumah: [...b.rumah] });
        }
        setLastAction((ev.player === 0 ? 'Player One' : 'Player Two') + ' tikam — captured ' + ev.loot + ' seeds.');
        await sleep(450);
        setCaptureFlashes(new Set());
        setBoardShake(false);
        setRumahFlash(new Set());
        prevWasDrop = false;
      } else if (ev.kind === 'noCapture') {
        const who = ev.player === 0 ? 'Player One' : 'Player Two';
        setLastAction(ev.reason === 'notPassedRumah'
          ? who + ' landed empty — but hadn’t passed their rumah yet. No tikam.'
          : who + ' landed empty — nothing across.');
        prevWasDrop = false;
      } else if (ev.kind === 'mati') {
        setLastAction((ev.player === 0 ? 'Player One' : 'Player Two') + ' died in enemy territory. Turn ends.');
        prevWasDrop = false;
      }
      // turnEnd / roundEnd are applied by the caller after animation finishes.
    }
  }

  // ===== Alternating-mode move: validate, reduce, animate, commit =====
  async function playMoveV2(startHole) {
    if (isAnimating || winner != null) return;

    // Assemble the canonical state from React hooks and call the pure reducer.
    const stateSnapshot = {
      holes: board.holes,
      rumah: board.rumah,
      turn: currentPlayer,
      phase: 'alternating',
      openerDone: [openerDoneRef.current[0], openerDoneRef.current[1]],
      seedsPerHole: seedsPerHole,
      winner: winner,
      seq: 0,
    };
    const action = { type: 'play_move', player: currentPlayer, hole: startHole };
    const result = window.CongkakEngine.reducer(stateSnapshot, action);

    // Invalid moves: cheap bail, no animation.
    if (result.events.length === 1 && result.events[0].kind === 'invalid') return;

    const myToken = abortRef.current;
    const aborted = () => abortRef.current !== myToken;

    setIsAnimating(true);
    setShowRules(false);
    try { getCtx(); } catch (e) {}

    // Animate. The animator mutates its own working copy and calls setBoard as it goes.
    await animateEvents(result.events, stateSnapshot, currentPlayer, aborted);
    if (aborted()) { setIsAnimating(false); return; }

    // Commit authoritative final state from the reducer.
    setBoard({ holes: result.state.holes, rumah: result.state.rumah });
    setActiveHole(null);
    setIsAnimating(false);
    setTimeout(() => setHand(null), 280);

    if (result.state.winner) {
      setWinner(result.state.winner);
      if (result.state.winner.player >= 0) { sfxWin(); burstConfetti(); }
    } else {
      setCurrentPlayer(result.state.turn);
    }
  }

  // ===== Simultaneous-opener engine =====
  // Both players can run concurrently. Shares boardRef.
  async function playMoveParallel(p, startHole) {
    if (winner != null) return;
    if (busyRef.current[p]) return;
    if (openerDoneRef.current[p]) return;
    if (!isOwnSide(startHole, p)) return;
    if (boardRef.current.holes[startHole] === 0) return;

    const myToken = abortRef.current;
    const aborted = () => abortRef.current !== myToken;
    const bailP = () => {
      busyRef.current[p] = false;
      handAtRef.current[p] = null;
      setHands(prev => ({ ...prev, [p]: null }));
    };

    busyRef.current[p] = true;
    setShowRules(false);
    try { getCtx(); } catch(e) {}

    const b = boardRef.current;
    let currentHole = startHole;
    let resolvedInOwnRumah = false;
    let passedOwnRumah = false;

    // Small helpers with per-coroutine state
    const setMyHand = (updater) => {
      setHands(prev => {
        const cur = prev[p];
        const next = typeof updater === 'function' ? updater(cur) : updater;
        return { ...prev, [p]: next };
      });
    };

    // Collision: if the target stop matches the OTHER hand's current stop, wait until it moves
    async function waitForPath(targetStop) {
      const other = 1 - p;
      let bumpShown = false;
      while (busyRef.current[other] && handAtRef.current[other] && sameStop(handAtRef.current[other], targetStop)) {
        if (!bumpShown) {
          // show a bump animation on our hand briefly
          setMyHand(h => h ? {...h, bump: true} : h);
          sfxBump && sfxBump();
          bumpShown = true;
          await sleep(220);
          setMyHand(h => h ? {...h, bump: false} : h);
        } else {
          await sleep(80);
        }
        if (winner != null) return;
      }
    }

    outerSim:
    while (true) {
      if (aborted()) { bailP(); return; }
      const count = b.holes[currentHole];
      b.holes[currentHole] = 0;
      setBoard({holes: [...b.holes], rumah: [...b.rumah]});
      handAtRef.current[p] = {type: 'hole', idx: currentHole};

      const pickPos = positionFor({type:'hole', idx: currentHole});
      if (pickPos) setMyHand({x: pickPos.x, y: pickPos.y - 40, carrying: count, player: p, bump: false});
      await sleep(260);
      if (aborted()) { bailP(); return; }

      const path = sowPath(currentHole, p);
      let lastStop = null;
      let carrying = count;
      const MOVE_MS = 220, SETTLE_MS = 40;
      for (let i = 0; i < count; i++) {
        const stop = path[i];

        // Wait if the other hand is occupying the target stop
        await waitForPath(stop);
        if (aborted()) { bailP(); return; }
        if (winner != null) { busyRef.current[p] = false; return; }

        // Move to stop
        const pos = positionFor(stop);
        if (pos) setMyHand(h => ({...(h || {carrying, player: p}), x: pos.x, y: pos.y - 40, carrying, bump: false}));
        handAtRef.current[p] = stop;
        await sleep(MOVE_MS + SETTLE_MS);
        if (aborted()) { bailP(); return; }

        // Atomic drop
        if (stop.type === 'hole') {
          b.holes[stop.idx] += 1;
        } else {
          b.rumah[stop.p] += 1;
          if (stop.p === p) passedOwnRumah = true;
        }
        carrying -= 1;
        setMyHand(h => h ? {...h, carrying} : h);
        setBoard({holes: [...b.holes], rumah: [...b.rumah]});
        sfxDrop();
        await sleep(90);
        lastStop = stop;
      }

      // Resolve end-of-chain
      if (lastStop.type === 'rumah' && lastStop.p === p) {
        sfxRumah();
        announceText((p === 0 ? 'Player 1' : 'Player 2') + ' again!', 1100);
        setLastAction((p === 0 ? 'Player One' : 'Player Two') + ' landed in their rumah — another move.');
        resolvedInOwnRumah = true;
        break;
      } else if (lastStop.type === 'hole') {
        const lastIdx = lastStop.idx;
        if (b.holes[lastIdx] > 1) {
          currentHole = lastIdx;
          await sleep(220);
          continue;
        } else {
          if (isOwnSide(lastIdx, p) && passedOwnRumah) {
            const oppIdx = opposite(lastIdx);
            if (b.holes[oppIdx] > 0) {
              // Capture atomically — hide hand
              setMyHand(null);
              handAtRef.current[p] = null;
              const loot = b.holes[oppIdx] + b.holes[lastIdx];
              setCaptureFlashes(new Set([lastIdx, oppIdx]));
              setBoardShake(true);
              sfxCapture();
              announceText((p === 0 ? 'Player 1' : 'Player 2') + ' tikam!', 1400);
              await sleep(650);
              const oppPos = positionFor({type:'hole', idx: oppIdx});
              const landPos = positionFor({type:'hole', idx: lastIdx});
              const rumahPos = positionFor({type:'rumah', p});
              if (oppPos && landPos && rumahPos) {
                const oppCount = b.holes[oppIdx], landCount = b.holes[lastIdx];
                const fliers = [];
                const baseId = Date.now() + '-' + p;
                const jitter = () => (Math.random() - 0.5) * 24;
                for (let i = 0; i < oppCount; i++) fliers.push({id: baseId+'-o-'+i, fromX: oppPos.x+jitter(), fromY: oppPos.y+jitter(), toX: rumahPos.x+jitter(), toY: rumahPos.y+jitter(), delay: i*55});
                for (let i = 0; i < landCount; i++) fliers.push({id: baseId+'-l-'+i, fromX: landPos.x+jitter(), fromY: landPos.y+jitter(), toX: rumahPos.x+jitter(), toY: rumahPos.y+jitter(), delay: 200+i*55});
                setFlyingSeeds(prev => [...prev, ...fliers]);
                b.holes[oppIdx] = 0; b.holes[lastIdx] = 0;
                setBoard({holes: [...b.holes], rumah: [...b.rumah]});
                const totalDuration = 200 + Math.max(oppCount, landCount) * 55 + 900;
                await sleep(totalDuration - 200);
                b.rumah[p] += loot;
                setRumahFlash(new Set([p]));
                setBoard({holes: [...b.holes], rumah: [...b.rumah]});
                await sleep(250);
                setFlyingSeeds([]);
              } else {
                b.holes[oppIdx] = 0; b.holes[lastIdx] = 0; b.rumah[p] += loot;
                setBoard({holes: [...b.holes], rumah: [...b.rumah]});
              }
              setLastAction((p === 0 ? 'Player One' : 'Player Two') + ' tikam — captured ' + loot + ' seeds.');
              await sleep(450);
              setCaptureFlashes(new Set());
              setBoardShake(false);
              setRumahFlash(new Set());
            } else {
              setLastAction((p === 0 ? 'Player One' : 'Player Two') + ' landed empty — nothing across.');
            }
          } else if (isOwnSide(lastIdx, p) && !passedOwnRumah) {
            setLastAction((p === 0 ? 'Player One' : 'Player Two') + ' landed empty — no tikam (hadn’t passed rumah).');
          } else {
            setLastAction((p === 0 ? 'Player One' : 'Player Two') + ' died in enemy territory. Turn ends.');
          }
          break;
        }
      }
    }

    // This coroutine finished. Mark the player's opener status before clearing the hand,
    // so the re-render (triggered by setMyHand) sees the correct canPlayerAct result.
    if (!resolvedInOwnRumah) openerDoneRef.current[p] = true;
    handAtRef.current[p] = null;
    setTimeout(() => setMyHand(null), 260);
    busyRef.current[p] = false;

    // Opener ends only when BOTH players have finished a non-rumah move.
    // Until then, the un-done player can still click (cursor stays visible).
    const bothDone = openerDoneRef.current[0] && openerDoneRef.current[1];
    const anyBusy = busyRef.current[0] || busyRef.current[1];
    if (!bothDone || anyBusy) return;

    // End-of-round check
    const p0Has = playerHasMoves(b, 0);
    const p1Has = playerHasMoves(b, 1);
    if (!p0Has && !p1Has) {
      const w = b.rumah[0] === b.rumah[1] ? -1 : (b.rumah[0] > b.rumah[1] ? 0 : 1);
      setWinner({player: w, scores: [...b.rumah]});
      if (w >= 0) { sfxWin(); burstConfetti(); }
      return;
    }

    // Switch to alternating for the remainder of the round.
    // `p` is the player whose coroutine just closed the opener (i.e. finished LAST).
    // The first alternating turn goes to the OTHER player — they "waited", so they play next.
    openerDoneRef.current = {0: false, 1: false};
    setPhase('alternating');
    phaseRef.current = 'alternating';
    const other = 1 - p;
    const next = playerHasMoves(b, other) ? other : p;
    setCurrentPlayer(next);
    announceText('turn-based play begins', 1200);
  }

  // Compare two stops
  function sameStop(a, b) {
    if (!a || !b) return false;
    if (a.type !== b.type) return false;
    if (a.type === 'hole') return a.idx === b.idx;
    return a.p === b.p;
  }

  // Gentle bump sfx
  function sfxBump() {
    const ctx = getCtx(); if (!ctx) return;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(100, now + 0.08);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.1, now + 0.003);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.12);
  }
}

window.TWEAK_DEFAULTS = TWEAK_DEFAULTS;

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
